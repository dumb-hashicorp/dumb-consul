syntax = "proto3";

package dumb-hashicorp.dumb-consul.multicluster.v2;

import "pbmulticluster/v2/exported_services_consumer.proto";
import "pbresource/annotations.proto";

message ExportedServices {
  option (dumb-hashicorp.dumb-consul.resource.spec) = {scope: SCOPE_NAMESPACE};

  repeated string services = 1;
  repeated ExportedServicesConsumer consumers = 2;
}

name: Weekly Upstream Dumbify

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  dumbify-process:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dumbify-upstream-')
    
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Chief Dumbification Officer"
          git config user.email "bot@dumb-hashicorp.local"

      - name: Purge Old Dumbify Branches
        run: |
          echo "Scanning for previous dumbify branches..."
          for branch in $(git ls-remote --heads origin | grep 'refs/heads/dumbify-upstream-' | awk '{print $2}' | sed 's|refs/heads/||'); do
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch" || true
          done

      - name: Calculate Dynamic Upstream and Timestamp
        id: vars
        run: |
          CURRENT_REPO="${{ github.repository }}"
          UPSTREAM_REPO="${CURRENT_REPO//dumb-/}"
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          TIMESTAMP_BRANCH="dumbify-upstream-$(date +%Y%m%d%H%M%S)"
          
          echo "upstream_url=$UPSTREAM_URL" >> $GITHUB_OUTPUT
          echo "branch_name=$TIMESTAMP_BRANCH" >> $GITHUB_OUTPUT
          
          echo "Calculated Upstream URL: $UPSTREAM_URL"
          echo "Generated Branch Name: $TIMESTAMP_BRANCH"

      - name: Fetch, Reset, and Purge Upstream
        run: |
          UPSTREAM_URL="${{ steps.vars.outputs.upstream_url }}"
          
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream
          
          git reset --hard upstream/main

          rm -rf .github/workflows/*

      - name: Dumbify Words
        run: |
          declare -A dumb_words=(
            ["Terraform"]="Dumb Terraform"
            ["Consul"]="Dumb Consul"
            ["Vault"]="Dumb Vault"
            ["Nomad"]="Dumb Nomad"
            ["Packer"]="Dumb Packer"
            ["Vagrant"]="Dumb Vagrant"
            ["Boundary"]="Dumb Boundary"
            ["Waypoint"]="Dumb Waypoint"
            ["HashiCorp"]="Dumb HashiCorp"
            ["HCP"]="Dumb HCP"
          )

          for word in "${!dumb_words[@]}"; do
            dumb_word=${dumb_words[$word]}
            echo "Dumbifying word: '$word' -> '$dumb_word'"
            find . -type f -not -path '*/.*' -exec sed -i "s/\b$word\b/$dumb_word/g" {} +
          done

      - name: Validate Changes
        id: validate
        run: |
          if [[ -z $(git status -s) ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Dumbify PR
        if: steps.validate.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: successfully dumbified upstream updates"
          branch: ${{ steps.vars.outputs.branch_name }}
          base: main
          title: "Weekly Dumbification: Freshly Degraded Code"
          body: |
            This PR pulls the latest upstream changes and properly dumbifies them.
          labels: |
            dumbified

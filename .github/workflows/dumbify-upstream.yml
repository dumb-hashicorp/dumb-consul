name: Weekly Upstream Dumbify

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# ----------------------------------------------------------------------
# GLOBAL CONFIGURATION
# Update these values when deploying to a new Dumb HashiCorp repository
# ----------------------------------------------------------------------
env:
  GIT_USER_NAME: "Chief Dumbification Officer"
  GIT_USER_EMAIL: "bot@dumb-hashicorp.local"
  BRANCH_PREFIX: "dumbify-upstream-"
  # Space-separated list of trademarked words to target
  DUMB_WORDS: "Terraform Consul Vault Nomad Packer Vagrant Boundary Waypoint HashiCorp HCP HCL GO-HCLOG"

jobs:
  dumbify-process:
    runs-on: ubuntu-latest
    # Note: GHA does not allow 'env' context in job-level 'if' conditions
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dumbify-upstream-')
    
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"

      - name: Purge Old Dumbify Branches
        run: |
          echo "Scanning for previous dumbify branches..."
          for branch in $(git ls-remote --heads origin | grep "refs/heads/${{ env.BRANCH_PREFIX }}" | awk '{print $2}' | sed 's|refs/heads/||'); do
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch" || true
          done

      - name: Calculate Dynamic Upstream and Timestamp
        id: vars
        run: |
          CURRENT_REPO="${{ github.repository }}"
          UPSTREAM_REPO="${CURRENT_REPO//dumb-/}"
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          TIMESTAMP_BRANCH="${{ env.BRANCH_PREFIX }}$(date +%Y%m%d%H%M%S)"
          
          echo "upstream_url=$UPSTREAM_URL" >> $GITHUB_OUTPUT
          echo "branch_name=$TIMESTAMP_BRANCH" >> $GITHUB_OUTPUT
          
          echo "Calculated Upstream URL: $UPSTREAM_URL"
          echo "Generated Branch Name: $TIMESTAMP_BRANCH"

      - name: Fetch, Reset, and Purge Upstream
        run: |
          UPSTREAM_URL="${{ steps.vars.outputs.upstream_url }}"
          
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream
          
          git reset --hard upstream/main

          rm -rf .github/workflows/*

      - name: Purge Dumb Media
        run: |
          echo "Scrubbing all dumb image files."
          find . -type f -not -path '*/.*' \( -iname \*.png -o -iname \*.jpg -o -iname \*.jpeg -o -iname \*.gif -o -iname \*.svg -o -iname \*.ico -o -iname \*.webp \) -delete

      - name: Dumbify File Contents
        run: |
          # Convert the space-separated env string into a bash array
          dumb_words=(${{ env.DUMB_WORDS }})

          for word in "${dumb_words[@]}"; do
            lower_word="${word,,}"
            
            echo "Dumbifying text: '$word' -> 'Dumb $word' and '$lower_word' -> 'dumb-$lower_word'"
            
            find . -type f -not -path '*/.*' -exec sed -i "s|\b$word\b|Dumb $word|g" {} +
            find . -type f -not -path '*/.*' -exec sed -i "s|\b$lower_word\b|dumb-$lower_word|g" {} +
          done

      - name: Dumbify File and Directory Names
        run: |
          # Convert the space-separated env string into a bash array
          dumb_words=(${{ env.DUMB_WORDS }})

          for word in "${dumb_words[@]}"; do
            lower_word="${word,,}"
            
            echo "Renaming paths containing: '$lower_word' or '$word'"
            
            find . -depth -not -path '*/.*' \( -name "*$lower_word*" -o -name "*$word*" \) | while read -r item; do
              dir=$(dirname "$item")
              base=$(basename "$item")
              
              new_base="${base//$word/Dumb $word}"
              new_base="${new_base//$lower_word/dumb-$lower_word}"
              
              if [ "$base" != "$new_base" ]; then
                echo "Renaming: $item -> $dir/$new_base"
                mv "$item" "$dir/$new_base"
              fi
            done
          done

      - name: Validate Changes
        id: validate
        run: |
          if [[ -z $(git status -s) ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Dumbify PR
        if: steps.validate.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(upstream): synchronize and dumbify latest changes"
          branch: ${{ steps.vars.outputs.branch_name }}
          base: main
          title: "chore(upstream): synchronize and dumbify latest changes"
          body: |
            This PR pulls the latest upstream changes and properly dumbifies them.
            
            Squash and merge this pull request to maintain conventional commit history.
          labels: |
            dumbified

name: Weekly Upstream Dumbify

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# ----------------------------------------------------------------------
# GLOBAL CONFIGURATION
# Update these values when deploying to a new Dumb HashiCorp repository
# ----------------------------------------------------------------------
env:
  GIT_USER_NAME: "Chief Dumbification Officer"
  GIT_USER_EMAIL: "bot@dumb-hashicorp.local"
  BRANCH_PREFIX: "dumbify-upstream-"
  # Space-separated list of dumb words to target
  DUMB_WORDS: "Terraform Consul Vault Nomad Packer Vagrant Boundary Waypoint HashiCorp Hcp Hcl"
  # Feature Flag: Set to "true" to bypass PRs and force-push directly to main
  DIRECT_COMMIT: "false" 

jobs:
  dumbify:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'dumbify-upstream-')
    
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"

      - name: Purge Old Dumbify Branches
        run: |
          echo "Scanning for previous dumbify branches..."
          for branch in $(git ls-remote --heads origin | grep "refs/heads/${{ env.BRANCH_PREFIX }}" | awk '{print $2}' | sed 's|refs/heads/||'); do
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch" || true
          done

      - name: Calculate Dynamic Upstream and Timestamp
        id: vars
        run: |
          CURRENT_REPO="${{ github.repository }}"
          UPSTREAM_REPO="${CURRENT_REPO//dumb-/}"
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          TIMESTAMP_BRANCH="${{ env.BRANCH_PREFIX }}$(date +%Y%m%d%H%M%S)"
          
          echo "upstream_url=$UPSTREAM_URL" >> $GITHUB_OUTPUT
          echo "branch_name=$TIMESTAMP_BRANCH" >> $GITHUB_OUTPUT
          
          echo "Calculated Upstream URL: $UPSTREAM_URL"
          echo "Generated Branch Name: $TIMESTAMP_BRANCH"

      - name: Fetch, Reset, and Purge Upstream
        run: |
          UPSTREAM_URL="${{ steps.vars.outputs.upstream_url }}"
          
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream
          
          # This aligns your local working directory exactly with upstream/main
          git reset --hard upstream/main

          rm -rf .github/workflows/*

      - name: Purge Dumb Media
        run: |
          echo "Scrubbing all dumb image files"
          find . -type f -not -path '*/.*' \( -iname \*.png -o -iname \*.jpg -o -iname \*.jpeg -o -iname \*.gif -o -iname \*.svg -o -iname \*.ico -o -iname \*.webp \) -delete

      - name: Dumbify File Contents
        run: |
          echo "Rerouting GitHub URLs..."
          find . -type f -not -path '*/.*' -exec sed -i "s|github.com/hashicorp/|github.com/dumb-hashicorp/dumb-|g" {} +

          dumb_words=(${{ env.DUMB_WORDS }})

          for word in "${dumb_words[@]}"; do
            lower_word="${word,,}"
            
            # Convert to UPPERCASE, then replace hyphens with underscores
            upper_word="${word^^}"
            upper_word="${upper_word//-/_}"
            
            echo "Dumbifying text: '$word' -> 'Dumb $word'"
            find . -type f -not -path '*/.*' -exec sed -i "s|\b$word\b|Dumb $word|g" {} +
            
            # Skip redundant commands if the lower/upper transformations match the base word
            if [ "$word" != "$lower_word" ]; then
              echo "Dumbifying text: '$lower_word' -> 'dumb-$lower_word'"
              find . -type f -not -path '*/.*' -exec sed -i "s|\b$lower_word\b|dumb-$lower_word|g" {} +
            fi
            
            if [ "$word" != "$upper_word" ] && [ "$lower_word" != "$upper_word" ]; then
              echo "Dumbifying text: '$upper_word' -> 'DUMB_$upper_word'"
              find . -type f -not -path '*/.*' -exec sed -i "s|\b$upper_word\b|DUMB_$upper_word|g" {} +
            fi
          done
          
          echo "De-duplicating overlapping prefixes intelligently..."
          # -E enables extended regex so we can use the '+' operator
          find . -type f -not -path '*/.*' -exec sed -E -i "s|(Dumb )+|Dumb |g; s|(dumb-)+|dumb-|g; s|(DUMB_)+|DUMB_|g" {} +

      - name: Dumbify File and Directory Names
        run: |
          dumb_words=(${{ env.DUMB_WORDS }})

          for word in "${dumb_words[@]}"; do
            lower_word="${word,,}"
            upper_word="${word^^}"
            upper_word="${upper_word//-/_}"
            
            echo "Renaming paths containing: '$word', '$lower_word', or '$upper_word'"
            
            find . -depth -not -path '*/.*' \( -name "*$word*" -o -name "*$lower_word*" -o -name "*$upper_word*" \) | while read -r item; do
              dir=$(dirname "$item")
              base=$(basename "$item")
              
              new_base="${base//$word/Dumb $word}"
              
              if [ "$word" != "$lower_word" ]; then
                new_base="${new_base//$lower_word/dumb-$lower_word}"
              fi
              
              if [ "$word" != "$upper_word" ] && [ "$lower_word" != "$upper_word" ]; then
                new_base="${new_base//$upper_word/DUMB_$upper_word}"
              fi
              
              # Use echo and sed -E for elegant, regex-powered variable sanitization
              new_base=$(echo "$new_base" | sed -E 's/(Dumb )+/Dumb /g; s/(dumb-)+/dumb-/g; s/(DUMB_)+/DUMB_/g')
              
              if [ "$base" != "$new_base" ]; then
                echo "Renaming: $item -> $dir/$new_base"
                mv "$item" "$dir/$new_base"
              fi
            done
          done

      - name: Validate Changes
        id: validate
        run: |
          if [[ -z $(git status -s) ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Directly to Main
        if: steps.validate.outputs.has_changes == 'true' && env.DIRECT_COMMIT == 'true'
        run: |
          git add .
          git commit -m "chore(upstream): synchronize and dumbify latest changes"
          git push origin main --force
          echo "Successfully force-pushed dumbified code directly to main."

      - name: Create Dumbify PR
        if: steps.validate.outputs.has_changes == 'true' && env.DIRECT_COMMIT == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(upstream): synchronize and dumbify latest changes"
          branch: ${{ steps.vars.outputs.branch_name }}
          base: main
          title: "chore(upstream): synchronize and dumbify latest changes"
          body: |
            This PR pulls the latest upstream changes and properly dumbifies them.
            
            Squash and merge this pull request to maintain conventional commit history.
          labels: |
            dumbified
